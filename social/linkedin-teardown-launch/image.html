<!doctype html><meta charset="utf-8"><style>
@font-face{font-family:S;src:url(Satoshi-Black.woff2);font-weight:900}
@font-face{font-family:S;src:url(Satoshi-Bold.woff2);font-weight:700}
@font-face{font-family:S;src:url(Satoshi-Medium.woff2);font-weight:500}
*{margin:0;box-sizing:border-box}
body{width:1080px;height:1350px;background:#faf8f4;font-family:S,sans-serif;color:#17171b;position:relative;overflow:hidden}
.top{position:absolute;left:84px;top:84px;font-weight:700;font-size:26px;letter-spacing:.14em;text-transform:uppercase;color:#ea2e00;display:flex;align-items:center;gap:14px}
.top i{width:12px;height:12px;border-radius:50%;background:#ff4a1c;display:block}
h1{position:absolute;left:84px;top:150px;font-weight:900;font-size:128px;line-height:.98;letter-spacing:-.035em}
h1 em{font-style:normal;color:#ea2e00}
.sub{position:absolute;left:84px;top:446px;font-weight:500;font-size:38px;color:#4a4a4f}
.stage{position:absolute;left:0;right:0;top:540px;height:600px}
.win{position:absolute;left:84px;width:560px;border:3px solid #17171b;border-radius:22px;background:#fff;box-shadow:12px 12px 0 #17171b}
.bar{height:50px;border-bottom:3px solid #17171b;display:flex;align-items:center;gap:10px;padding-left:20px}
.bar b{width:14px;height:14px;border-radius:50%;border:3px solid #17171b}
.b{height:22px;border-radius:6px;background:#e6e2d9;margin:0 24px}
.w1{top:20px;transform:rotate(-3deg)}
.w1 .body{padding:28px 0;display:grid;gap:18px}
.w2{top:250px;left:210px;width:560px;transform:rotate(2deg);background:#faf8f4;border-style:dashed;box-shadow:none}
.phone{position:absolute;left:690px;top:70px;width:270px;height:500px;border:3px solid #17171b;border-radius:44px;background:#fff;box-shadow:12px 12px 0 #ea2e00;transform:rotate(5deg);padding:48px 22px;display:grid;gap:16px;align-content:start}
.phone .b{margin:0;height:20px}
.pin{position:absolute;width:56px;height:56px;border-radius:50%;background:#ff4a1c;color:#fff;font-weight:900;font-size:30px;display:flex;align-items:center;justify-content:center;border:4px solid #faf8f4}
.foot{position:absolute;left:84px;right:84px;bottom:70px;display:flex;justify-content:space-between;align-items:center}
.foot img{height:70px}
.foot span{font-weight:700;font-size:30px;color:#17171b}
</style>
<div class="top"><i></i>Free teardown by our CTO</div>
<h1>We <em>tear down</em><br>your app.</h1>
<div class="sub">Free. 15 minutes. Recorded. No sales pitch.</div>
<div class="stage">
 <div class="win w1"><div class="bar"><b></b><b></b><b></b></div><div class="body"><div class="b" style="width:70%"></div><div class="b" style="background:#ffd9cf;height:70px"></div><div class="b" style="width:50%"></div></div></div>
 <div class="win w2"><div class="bar"><b></b><b></b><b></b></div><div style="padding:28px 0;display:grid;gap:18px"><div class="b" style="width:60%"></div><div class="b" style="width:80%"></div><div class="b" style="width:40%"></div></div></div>
 <div class="phone"><div class="b" style="width:60%"></div><div class="b" style="background:#ffd9cf;height:90px"></div><div class="b"></div><div class="b" style="width:70%"></div></div>
 <div class="pin" style="left:560px;top:0">1</div>
 <div class="pin" style="left:150px;top:330px">2</div>
 <div class="pin" style="left:930px;top:40px">3</div>
</div>
<div class="foot"><img src="logo.svg"><span>graynest.co/teardown</span></div>
